name: ✅ CI
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-retired-links:
    name: Validate retired repository links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check documentation and failure controls
        # actionlint 1.7.12 cannot parse $/ yet; keep the explicit read-only checkout.
        uses: ./.github/actions/documentation-links # zizmor: ignore[self-repository]

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint

  check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Test cold startup in a nested worktree
        run: bash scripts/nested-worktree.test.sh

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build

  lighthouse:
    name: Lighthouse Budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      # Budgets live in lighthouserc.json at error level (issue #99): missing any
      # configured budget (performance score, LCP, CLS, TBT, FCP) fails this job
      # and, through ci-required-checks, blocks the pull request.
      - run: npm run test:perf

  container-smoke:
    name: Container Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t asc-smoke .
      # Verifies the nginx config end-to-end: the running container must 301
      # the old /book-tid page to the contact section with a relative Location,
      # so the redirect keeps the visitor's public https origin.
      - run: |
          docker run -d --rm -p 8080:8080 --name asc-smoke asc-smoke
          # Fail closed: a homepage that never becomes ready is a broken image,
          # even if the explicit /book-tid redirect below would still answer.
          ready=false
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8080/; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker stop asc-smoke
            echo "::error::container homepage did not become ready within 30s"
            exit 1
          fi
          expected=/#kontakt
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/book-tid)
          location=$(curl -sI http://localhost:8080/book-tid | tr -d '\r' | awk 'tolower($1)=="location:" {print $2}')
          page_headers=$(curl -sI http://localhost:8080/ | tr -d '\r')
          docker stop asc-smoke
          if [ "$code" != "301" ] || [ "$location" != "$expected" ]; then
            echo "::error::expected 301 -> $expected, got $code -> $location"
            exit 1
          fi
          # Pages revalidate on every visit and keep the security headers.
          if ! printf '%s\n' "$page_headers" | grep -qix 'cache-control: no-cache' ||
            ! printf '%s\n' "$page_headers" | grep -qix 'x-content-type-options: nosniff'; then
            echo "::error::the homepage must send Cache-Control: no-cache and the security headers"
            exit 1
          fi

  # Keeps the Homepage dashboard discovering the site in its group. No npm install: the script is
  # `sh` + `yq`, both present on the runner.
  homepage-group:
    name: Homepage Group
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Homepage site classification
        run: sh scripts/homepage-group.test.sh

  # The platform reconciles deploy/ for production and deploy/dev for the dev environment, both from
  # the same published artifact. This renders all three entry points and keeps the production
  # identity (routes, domain, TLS, DNS, PDB, simply.com credentials) out of dev. No install: the
  # script is `sh` + `kubectl` + `yq`, all present on the runner.
  deploy-overlays:
    name: Deploy Overlays
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🧱 Render production and dev manifests
        run: sh scripts/deploy-overlays.test.sh

  # Dependabot writes package-lock.json with npm 11, and a lockfile one npm major writes fails the other
  # major's `npm ci`. package.json declares that major, and this keeps every job that runs npm, and the
  # Docker build, on a Node line that bundles it. No npm install: the script is `sh` + `yq` + `jq`, all
  # present on the runner.
  npm-toolchain:
    name: npm Toolchain
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 📦 Validate the npm major every install uses
        run: sh scripts/npm-toolchain.test.sh

  # A release, and so a deploy, is cut only for the commits .releaserc names. This keeps every package
  # classified as shipped (its updates release) or tooling (they do not), so a package that ends up in
  # the built site cannot have its updates stop short of the live site. No npm install: the script is
  # `sh` + `yq` + `jq`, all present on the runner.
  release-classification:
    name: Release Classification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🏷️ Validate which dependency updates release
        run: sh scripts/release-classification.test.sh

  # The template's shared MegaLinter checks for workflows, scripts, the Dockerfile, nginx config,
  # Markdown, YAML, JSON, CSS, Kubernetes manifests and leaked secrets; ESLint and svelte-check above
  # lint the site's own code. Configure it in .mega-linter.yml, which extends the template's base.
  megalinter:
    name: MegaLinter
    # GitHub's `$/` self-repository form fails actionlint until it supports it
    # (rhysd/actionlint#711); switch then.
    uses: ./.github/workflows/lint.yaml # zizmor: ignore[self-repository]
    permissions:
      contents: read

  ci-required-checks:
    name: CI - Required Checks
    runs-on: ubuntu-latest
    needs: [lint, check, test, e2e, build, lighthouse, container-smoke, homepage-group, deploy-overlays, npm-toolchain, release-classification, validate-retired-links, megalinter]
    permissions:
      actions: read
    if: ${{ always() }}
    steps:
      - name: 📊 Require all CI checks to pass
        uses: devantler-tech/.github/actions/aggregate-job-checks@cd371c6003deca3a3b417b783da73e05b4bf690f # v22.0.0
        with:
          check-workflow-startup: "true"
          job-results: >-
            ${{ needs.lint.result }}
            ${{ needs.check.result }}
            ${{ needs.test.result }}
            ${{ needs.e2e.result }}
            ${{ needs.build.result }}
            ${{ needs.lighthouse.result }}
            ${{ needs.container-smoke.result }}
            ${{ needs.homepage-group.result }}
            ${{ needs.deploy-overlays.result }}
            ${{ needs.npm-toolchain.result }}
            ${{ needs.release-classification.result }}
            ${{ needs.validate-retired-links.result }}
            ${{ needs.megalinter.result }}
