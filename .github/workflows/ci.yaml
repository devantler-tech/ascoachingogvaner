name: ✅ CI
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-retired-links:
    name: Validate retired repository links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check documentation and failure controls
        # actionlint 1.7.12 cannot parse $/ yet; keep the explicit read-only checkout.
        uses: ./.github/actions/documentation-links # zizmor: ignore[self-repository]

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint

  check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build

  lighthouse:
    name: Lighthouse Budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      # Budgets live in lighthouserc.json at error level (issue #99): missing any
      # configured budget (performance score, LCP, CLS, TBT, FCP) fails this job
      # and, through ci-required-checks, blocks the pull request.
      - run: npm run test:perf

  container-smoke:
    name: Container Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t asc-smoke .
      # Verifies the nginx config end-to-end: the running container must 301
      # the old /book-tid page to the contact section with a relative Location,
      # so the redirect keeps the visitor's public https origin.
      - run: |
          docker run -d --rm -p 8080:8080 --name asc-smoke asc-smoke
          # Fail closed: a homepage that never becomes ready is a broken image,
          # even if the explicit /book-tid redirect below would still answer.
          ready=false
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8080/; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker stop asc-smoke
            echo "::error::container homepage did not become ready within 30s"
            exit 1
          fi
          expected=/#kontakt
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/book-tid)
          location=$(curl -sI http://localhost:8080/book-tid | tr -d '\r' | awk 'tolower($1)=="location:" {print $2}')
          page_headers=$(curl -sI http://localhost:8080/ | tr -d '\r')
          docker stop asc-smoke
          if [ "$code" != "301" ] || [ "$location" != "$expected" ]; then
            echo "::error::expected 301 -> $expected, got $code -> $location"
            exit 1
          fi
          # Pages revalidate on every visit and keep the security headers.
          if ! printf '%s\n' "$page_headers" | grep -qix 'cache-control: no-cache' ||
            ! printf '%s\n' "$page_headers" | grep -qix 'x-content-type-options: nosniff'; then
            echo "::error::the homepage must send Cache-Control: no-cache and the security headers"
            exit 1
          fi

  # The portable pin contract ships from platform-tenant-template and is deliberately NOT
  # tenant-ignored, so it lands here on every sync. It validates immutable maintained
  # callers, keeping release and template-sync aligned and the publisher independently approved.
  # A caller reverting to a movable tag is the ordinary outcome of a hand edit or a bad merge, and it
  # is exactly what this guard refuses. The template's own scaffold contract already specifies this
  # wiring by name — a `workflow-caller-pins` job running the script, and required checks depending
  # on it — so this is that wiring, not a new convention. No npm install: the script is `sh` + `yq`,
  # both present on the runner.
  workflow-caller-pins:
    name: Workflow Caller Pins
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 📌 Validate reusable workflow caller pins
        run: sh scripts/workflow-caller-pin-contract.test.sh
      - name: Validate Homepage site classification
        run: sh scripts/homepage-group.test.sh

  # Dependabot writes package-lock.json with npm 11, and a lockfile one npm major writes fails the other
  # major's `npm ci`. package.json declares that major, and this keeps every job that runs npm, and the
  # Docker build, on a Node line that bundles it. No npm install: the script is `sh` + `yq` + `jq`, all
  # present on the runner.
  npm-toolchain:
    name: npm Toolchain
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 📦 Validate the npm major every install uses
        run: sh scripts/npm-toolchain.test.sh

  # A release, and so a deploy, is cut only for the commits .releaserc names. This keeps every package
  # classified as shipped (its updates release) or tooling (they do not), so a package that ends up in
  # the built site cannot have its updates stop short of the live site. No npm install: the script is
  # `sh` + `yq` + `jq`, all present on the runner.
  release-classification:
    name: Release Classification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🏷️ Validate which dependency updates release
        run: sh scripts/release-classification.test.sh

  # The platform deploys a release only when its publish-app.yaml revision is approved for this tenant.
  # A PR that moves the pin to an unapproved revision would ship a release the platform refuses, so the
  # template's check compares the base and head pins and fails the move here instead. An unchanged pin
  # passes without contacting the platform.
  publish-pin-approved:
    name: Publish Pin Approved
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 🧪 Test the publish pin check
        run: sh scripts/publish-pin-approved.test.sh
      - name: 📌 Refuse an unapproved publish-app pin
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Run the check as it exists on the base branch: a PR must not be able to weaken the check
          # that judges it.
          git show "${BASE_SHA}:scripts/publish-pin-approved.sh" >"${RUNNER_TEMP}/publish-pin-approved.sh"
          git show "${BASE_SHA}:.github/workflows/cd.yaml" >"${RUNNER_TEMP}/base-cd.yaml"
          sh "${RUNNER_TEMP}/publish-pin-approved.sh" "${RUNNER_TEMP}/base-cd.yaml" .github/workflows/cd.yaml

  ci-required-checks:
    name: CI - Required Checks
    runs-on: ubuntu-latest
    needs: [lint, check, test, e2e, build, lighthouse, container-smoke, workflow-caller-pins, npm-toolchain, release-classification, publish-pin-approved, validate-retired-links]
    permissions: {}
    if: ${{ always() }}
    steps:
      - name: 📊 Require all CI checks to pass
        uses: devantler-tech/.github/actions/aggregate-job-checks@7bf35c4fb0c2ccd8d1c08585e6ec5979a819d18e # v12.0.4
        with:
          job-results: >-
            ${{ needs.lint.result }}
            ${{ needs.check.result }}
            ${{ needs.test.result }}
            ${{ needs.e2e.result }}
            ${{ needs.build.result }}
            ${{ needs.lighthouse.result }}
            ${{ needs.container-smoke.result }}
            ${{ needs.workflow-caller-pins.result }}
            ${{ needs.npm-toolchain.result }}
            ${{ needs.release-classification.result }}
            ${{ needs.publish-pin-approved.result }}
            ${{ needs.validate-retired-links.result }}
