name: ✅ CI
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  lighthouse:
    name: Lighthouse Budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Budgets live in lighthouserc.json and are warn-level while calibrating
      # (issue #99): a budget miss prints the report but exits 0, so this job
      # only fails on infrastructure errors. Flip the assertions to "error"
      # to enforce once the numbers prove stable across releases.
      - run: npm run test:perf

  container-smoke:
    name: Container Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t asc-smoke .
      # Verifies the rendered nginx config end-to-end: the running container
      # must 301 /book-tid to the URL defined once in src/lib/site-config.json.
      - run: |
          docker run -d --rm -p 8080:8080 --name asc-smoke asc-smoke
          # Fail closed: a homepage that never becomes ready is a broken image,
          # even if the explicit /book-tid redirect below would still answer.
          ready=false
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8080/; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker stop asc-smoke
            echo "::error::container homepage did not become ready within 30s"
            exit 1
          fi
          expected=$(node -p "require('./src/lib/site-config.json').bookingUrl")
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/book-tid)
          location=$(curl -sI http://localhost:8080/book-tid | tr -d '\r' | awk 'tolower($1)=="location:" {print $2}')
          docker stop asc-smoke
          if [ "$code" != "301" ] || [ "$location" != "$expected" ]; then
            echo "::error::expected 301 -> $expected, got $code -> $location"
            exit 1
          fi

  # The portable pin contract ships from platform-tenant-template and is deliberately NOT
  # tenant-ignored, so it lands here on every sync — but nothing here ran it, so the SHA pins on the
  # three devantler-tech/actions callers (cd, release, template-sync) were unchecked in this tenant.
  # A caller reverting to a movable tag is the ordinary outcome of a hand edit or a bad merge, and it
  # is exactly what this guard refuses. The template's own scaffold contract already specifies this
  # wiring by name — a `workflow-caller-pins` job running the script, and required checks depending
  # on it — so this is that wiring, not a new convention. No npm install: the script is `sh` + `yq`,
  # both present on the runner.
  workflow-caller-pins:
    name: Workflow Caller Pins
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 📌 Validate reusable workflow caller pins
        run: sh scripts/workflow-caller-pin-contract.test.sh

  ci-required-checks:
    name: CI - Required Checks
    runs-on: ubuntu-latest
    needs: [lint, check, test, e2e, build, lighthouse, container-smoke, workflow-caller-pins]
    permissions: {}
    if: ${{ always() }}
    steps:
      - name: 📊 Require all CI checks to pass
        uses: devantler-tech/actions/aggregate-job-checks@4f4e07a3ebf3e1161756a292966e36c91a65ee04 # v13.3.0
        with:
          job-results: >-
            ${{ needs.lint.result }}
            ${{ needs.check.result }}
            ${{ needs.test.result }}
            ${{ needs.e2e.result }}
            ${{ needs.build.result }}
            ${{ needs.lighthouse.result }}
            ${{ needs.container-smoke.result }}
            ${{ needs.workflow-caller-pins.result }}
