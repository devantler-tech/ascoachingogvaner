name: 🎉 Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    # Skipped in the template repo itself; runs in every tenant created from it.
    if: github.repository != 'devantler-tech/platform-tenant-template'
    uses: devantler-tech/actions/.github/workflows/create-release.yaml@0bd47a5862cc4662cbfa6be327e06ba8e2562c4e # v13.10.4
    with:
      align-npm-with-consumer-contract: true
      disable-issue-side-effects: true
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
