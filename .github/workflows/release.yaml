name: 🎉 Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    # Skipped in the template repo itself; runs in every tenant created from it.
    if: github.repository != 'devantler-tech/platform-tenant-template'
    uses: devantler-tech/actions/.github/workflows/create-release.yaml@9293ed7fd2a2c18819fc1d9cfb3a2d600cd8fec6 # v13.10.5
    with:
      align-npm-with-consumer-contract: true
      disable-issue-side-effects: true
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
