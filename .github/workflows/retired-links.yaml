name: Documentation links
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-retired-links:
    name: Validate retired repository links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check documentation and failure controls
        # actionlint 1.7.12 cannot parse $/ yet; keep the explicit read-only checkout.
        uses: ./.github/actions/documentation-links # zizmor: ignore[self-repository]
