# Admin code secret, backed by the platform's OpenBao + External Secrets stack
# (replaces the former SOPS-encrypted Secret). Three tenant-owned resources:
#   1. Password generator  — produces a random admin code in-vault
#   2. PushSecret           — seeds it into OpenBao once (apps/ascoachingogvaner/admin)
#   3. ExternalSecret       — syncs it back into the ascoachingogvaner-admin-code
#                             Secret that the Deployment consumes as ADMIN_CODE
#
# The platform grants the read/write OpenBao policy for apps/ascoachingogvaner/*
# and the tenant RBAC to manage these resources (see devantler-tech/platform).
# Retrieve the generated code with:
#   kubectl -n ascoachingogvaner get secret ascoachingogvaner-admin-code \
#     -o jsonpath='{.data.ADMIN_CODE}' | base64 -d
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ascoachingogvaner-admin-code
  namespace: ascoachingogvaner
spec:
  length: 24
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: push-ascoachingogvaner-admin-code
  namespace: ascoachingogvaner
spec:
  # "0" generates the value once and never rotates it.
  refreshInterval: "0"
  secretStoreRefs:
    - name: openbao
      kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: ascoachingogvaner-admin-code
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: apps/ascoachingogvaner/admin
          property: admin-code
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ascoachingogvaner-admin-code
  namespace: ascoachingogvaner
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: ascoachingogvaner-admin-code
    creationPolicy: Owner
  data:
    - secretKey: ADMIN_CODE
      remoteRef:
        key: apps/ascoachingogvaner/admin
        property: admin-code
