# Admin code secret, backed by the platform's OpenBao + External Secrets stack
# (replaces the former SOPS-encrypted Secret). Tenant-owned resources:
#   1. SecretStore         — namespaced store auth'ing via the tenant's own
#                            Vault role (scoped to apps/ascoachingogvaner/* only,
#                            NOT the shared ClusterSecretStore) so this tenant
#                            can never reach infra or other tenants' secrets
#   2. Password generator  — produces a random admin code in-vault
#   3. PushSecret          — seeds it into OpenBao once (apps/ascoachingogvaner/admin)
#   4. ExternalSecret      — syncs it back into the ascoachingogvaner-admin-code
#                            Secret that the Deployment consumes as ADMIN_CODE
#
# The platform grants the tenant-scoped Vault role/policy and the tenant RBAC
# to manage these resources (see devantler-tech/platform). Retrieve the
# generated code with:
#   kubectl -n ascoachingogvaner get secret ascoachingogvaner-admin-code \
#     -o jsonpath='{.data.ADMIN_CODE}' | base64 -d
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: ascoachingogvaner
spec:
  provider:
    vault:
      server: "http://openbao.openbao.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          # Tenant-scoped Vault role (provisioned by the platform vault-config
          # Job): bound to this namespace's ascoachingogvaner ServiceAccount and
          # limited to secret/apps/ascoachingogvaner/*.
          role: "ascoachingogvaner"
          serviceAccountRef:
            name: "ascoachingogvaner"
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ascoachingogvaner-admin-code
  namespace: ascoachingogvaner
spec:
  length: 24
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: push-ascoachingogvaner-admin-code
  namespace: ascoachingogvaner
spec:
  # "0" generates the value once and never rotates it.
  refreshInterval: "0"
  secretStoreRefs:
    - name: openbao
      kind: SecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: ascoachingogvaner-admin-code
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: apps/ascoachingogvaner/admin
          property: admin-code
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ascoachingogvaner-admin-code
  namespace: ascoachingogvaner
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: ascoachingogvaner-admin-code
    creationPolicy: Owner
  data:
    - secretKey: ADMIN_CODE
      remoteRef:
        key: apps/ascoachingogvaner/admin
        property: admin-code
