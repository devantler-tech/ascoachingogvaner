apiVersion: apps/v1
kind: Deployment
metadata:
  name: ascoachingogvaner
  labels:
    app.kubernetes.io/name: ascoachingogvaner
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ascoachingogvaner
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ascoachingogvaner
    spec:
      imagePullSecrets:
        - name: ghcr-auth
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ascoachingogvaner
      containers:
        - name: ascoachingogvaner
          image: ghcr.io/devantler-tech/ascoachingogvaner:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ascoaching-db-app
                  key: uri
            - name: ADMIN_CODE
              valueFrom:
                secretKeyRef:
                  name: ascoachingogvaner-admin-code
                  key: ADMIN_CODE
            - name: NOTIFY_EMAIL
              value: "alettekontakt@gmail.com"
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: ascoachingogvaner-admin-code
                  key: SMTP_HOST
                  optional: true
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: ascoachingogvaner-admin-code
                  key: SMTP_PORT
                  optional: true
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: ascoachingogvaner-admin-code
                  key: SMTP_USER
                  optional: true
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: ascoachingogvaner-admin-code
                  key: SMTP_PASS
                  optional: true
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: ascoachingogvaner-admin-code
                  key: SMTP_FROM
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
