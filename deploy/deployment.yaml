apiVersion: apps/v1
kind: Deployment
metadata:
  name: ascoachingogvaner
  labels:
    app.kubernetes.io/name: ascoachingogvaner
    # Deliberate 2-replica deployment: opt out of the platform's 3-replica HA
    # floor (validate-replica-floor, platform#1882). 2 replicas + the
    # DoNotSchedule hostname spread + the maxUnavailable: 1 PDB keep one replica
    # up through a node drain; a third replica buys headroom this small static
    # site doesn't need.
    platform.devantler.tech/replica-floor: exempt
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ascoachingogvaner
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ascoachingogvaner
    spec:
      imagePullSecrets:
        - name: ghcr-auth
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ascoachingogvaner
      containers:
        - name: ascoachingogvaner
          image: ghcr.io/devantler-tech/ascoachingogvaner:latest
          imagePullPolicy: Always
          ports:
            # Static site served by unprivileged nginx (listens on 8080).
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
