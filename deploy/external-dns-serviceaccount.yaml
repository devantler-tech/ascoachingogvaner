# Identity for the tenant-owned external-dns instance. The platform binds the
# read capabilities this controller needs (HTTPRoutes here, the shared Gateway
# in kube-system, namespaces) to exactly this ServiceAccount — see the
# platform's k8s/bases/apps/ascoachingogvaner/external-dns-rbac.yaml — so it
# runs with less privilege than the tenant's main `ascoachingogvaner` SA.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-dns
  namespace: ascoachingogvaner
