apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ascoachingogvaner
  namespace: ascoachingogvaner
  # Homepage dashboard entry. These gethomepage.dev/* annotations are tenant
  # self-presentation, so they live here in the tenant artifact rather than
  # being injected by the platform's hetzner overlay — the platform's homepage
  # app discovers them on this HTTPRoute cluster-wide wherever they are authored.
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: AS - Coaching, vaner og ro
    gethomepage.dev/description: Personal/business static site.
    gethomepage.dev/group: Customer Sites
    gethomepage.dev/icon: mdi-account-tie
    gethomepage.dev/href: https://ascoachingogvaner.dk
    gethomepage.dev/pod-selector: app.kubernetes.io/name=ascoachingogvaner
spec:
  parentRefs:
    # The shared hostname-less HTTPS listener under the platform wildcard
    # certificate — used here only for the local/dev platform.lan host.
    - name: platform
      namespace: kube-system
      sectionName: https
    # The SNI listener dedicated to the tenant-owned domain (added by the
    # platform's hetzner overlay, with the domain's own certificate). On
    # clusters without that listener this parentRef simply reports unattached
    # while the one above keeps working.
    - name: platform
      namespace: kube-system
      sectionName: https-ascoachingogvaner-dk
  hostnames:
    # The tenant owns its public hostnames (the platform no longer patches
    # them in): the customer domain, DNS-managed at simply.com by the
    # platform's external-dns-simply instance...
    - ascoachingogvaner.dk
    # ...and the host-file hostname used on local/dev clusters.
    - ascoachingogvaner.platform.lan
  rules:
    - backendRefs:
        - name: ascoachingogvaner
          port: 80
