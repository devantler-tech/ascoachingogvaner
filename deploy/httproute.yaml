apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ascoachingogvaner
  namespace: ascoachingogvaner
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: https
  hostnames:
    - ascoachingogvaner.platform.lan
  rules:
    - backendRefs:
        - name: ascoachingogvaner
          port: 80
