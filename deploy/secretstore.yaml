# Namespaced SecretStore for this tenant's OpenBao-backed secrets (today: the
# simply.com DNS credentials the tenant-owned external-dns consumes, read by
# simply-credentials-externalsecret.yaml). Tenant-owned — the tenant's `edit`
# RoleBinding aggregates `external-secrets-tenant-edit`, so the tenant SA may
# create its own SecretStore.
#
# Authenticates as the tenant's own `ascoachingogvaner` ServiceAccount via the
# dedicated `ascoachingogvaner` OpenBao Kubernetes auth role, which the platform
# scopes (in vault-config) to read + seed-write under
# secret/{data,metadata}/apps/ascoachingogvaner/* only — so this store can never
# reach infra or another tenant's secrets, and the confinement stays
# platform-enforced regardless of who owns this resource. Must be a namespaced
# SecretStore (never the shared `openbao` ClusterSecretStore — the
# `restrict-tenant-secret-stores` Kyverno policy blocks that).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: ascoachingogvaner
  labels:
    app.kubernetes.io/name: app
spec:
  provider:
    vault:
      # openbao-active = unsealed Raft leader only; the plain `openbao` Service
      # also round-robins onto sealed-but-Ready standbys (503 "Vault is sealed").
      server: "http://openbao-active.openbao.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "ascoachingogvaner"
          serviceAccountRef:
            name: "ascoachingogvaner"
