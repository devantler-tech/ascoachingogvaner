# simply.com API credentials for the tenant-owned external-dns instance,
# sourced from the tenant's OpenBao path through the platform-provisioned
# namespaced SecretStore (never the shared ClusterSecretStore — the
# restrict-tenant-secret-stores Kyverno policy enforces that). The values are
# seeded once by the maintainer at secret/apps/ascoachingogvaner/simply:
# account_name = the Sxxxxxx account number, api_key = the API key from the
# simply.com control panel (Account -> API).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: simply-credentials
  namespace: ascoachingogvaner
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: simply-credentials
    creationPolicy: Owner
  data:
    - secretKey: account-name
      remoteRef:
        key: apps/ascoachingogvaner/simply
        property: account_name
    - secretKey: api-key
      remoteRef:
        key: apps/ascoachingogvaner/simply
        property: api_key
