# simply.com API credentials for the tenant-owned external-dns instance,
# sourced from the tenant's OpenBao path through the platform-provisioned
# namespaced SecretStore (never the shared ClusterSecretStore — the
# restrict-tenant-secret-stores Kyverno policy enforces that). The path
# secret/apps/ascoachingogvaner/simply is created with placeholder values by
# simply-credentials-seed.yaml (a committed generator + write-once PushSecret),
# so it always exists; replace the placeholders with the real values in OpenBao
# (account_name = the Sxxxxxx account number, api_key = the simply.com control
# panel API key) — the seed's IfNotExists guard never overwrites them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: simply-credentials
  namespace: ascoachingogvaner
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: simply-credentials
    creationPolicy: Owner
  data:
    - secretKey: account-name
      remoteRef:
        key: apps/ascoachingogvaner/simply
        property: account_name
    - secretKey: api-key
      remoteRef:
        key: apps/ascoachingogvaner/simply
        property: api_key
