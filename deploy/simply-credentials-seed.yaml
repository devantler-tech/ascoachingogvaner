# One-time SEED for the simply.com credentials at the tenant's OpenBao path
# secret/apps/ascoachingogvaner/simply, so the path exists without anyone
# hand-creating it (and without SOPS). It writes a random PLACEHOLDER into
# both account_name and api_key; external-dns then starts but its simply.com
# API calls fail auth until you replace the placeholder with the real values.
#
# Replace the real values once, directly in OpenBao (UI: vault.platform.devantler.tech
# -> secret/ engine -> apps/ascoachingogvaner/simply, or `bao kv patch`):
#   account_name = the Sxxxxxx account number
#   api_key      = the API key from the simply.com control panel (Account -> API)
#
# Your replacement STICKS — two guards make this seed write-once:
#   * updatePolicy: IfNotExists  -> never overwrites a key that already exists,
#                                   so a controller restart can't clobber the
#                                   real value back to the placeholder.
#   * refreshInterval: "0"       -> generated/pushed once, never on a timer.
#   * deletionPolicy: None       -> deleting this PushSecret leaves the OpenBao
#                                   value intact (safe to remove after seeding).
# RBAC/store: written through the tenant's namespaced `openbao` SecretStore
# (platform-provisioned), authenticating via the tenant Vault role scoped to
# apps/ascoachingogvaner/* — never the shared ClusterSecretStore (the
# restrict-tenant-secret-stores Kyverno policy enforces that). `Password` is
# the only generator kind a tenant may create (external-secrets-tenant-edit).
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: simply-credentials-seed
  namespace: ascoachingogvaner
spec:
  length: 24
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: simply-credentials-seed
  namespace: ascoachingogvaner
spec:
  refreshInterval: "0"
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - name: openbao
      kind: SecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: simply-credentials-seed
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: apps/ascoachingogvaner/simply
          property: account_name
    - match:
        secretKey: password
        remoteRef:
          remoteKey: apps/ascoachingogvaner/simply
          property: api_key
