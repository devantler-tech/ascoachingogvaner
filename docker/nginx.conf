# Serves the prerendered static site (built by @sveltejs/adapter-static).
# Listens on 8080 so it can run as an unprivileged, non-root user.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the precompressed .gz files adapter-static emits when available.
    gzip_static on;

    # Security headers (previously set by the SvelteKit server hook).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Hashed build assets are immutable and safe to cache aggressively.
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /404.html;
    }
}
