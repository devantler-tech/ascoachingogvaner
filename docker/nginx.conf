# Serves the prerendered static site (built by @sveltejs/adapter-static).
# Listens on 8080 so it can run as an unprivileged, non-root user.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the precompressed .gz files adapter-static emits when available.
    gzip_static on;

    # Security headers on every response (see the snippet for why it must also
    # be re-included in any location that sets its own add_header).
    include /etc/nginx/snippets/security-headers.conf;

    # Send redirects as relative paths. nginx otherwise builds an absolute URL
    # from its own scheme and port (http, 8080), which is not reachable behind
    # the cluster gateway; a relative Location keeps the visitor's https origin.
    absolute_redirect off;

    # Redirect legacy multi-page routes to the single-page anchors so old
    # bookmarks and backlinks keep working. Sessions are booked by email or the
    # contact form, so the old booking page leads to the contact section.
    location = /services { return 301 /#services; }
    location = /om-mig { return 301 /#om-mig; }
    location = /kontakt { return 301 /#kontakt; }
    location = /book-tid { return 301 /#kontakt; }

    # Hashed build assets are immutable and safe to cache aggressively. The
    # Cache-Control add_header suppresses the inherited server-level headers,
    # so the security snippet is re-included here.
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Unknown paths get a real 404 status (not 200) while still showing the
    # branded fallback page. Pages revalidate on every visit (a cheap 304 via
    # the ETag): without this a browser may reuse an old page after a deploy,
    # and that page names hashed assets the new image no longer contains.
    error_page 404 /404.html;
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
