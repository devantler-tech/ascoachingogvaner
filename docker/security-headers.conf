# Security headers for EVERY response. nginx does NOT inherit add_header into
# a location block that declares any add_header of its own, so this snippet is
# included both at server level and in each such location (see nginx.conf).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# The page-level Content-Security-Policy is baked into the prerendered HTML as
# a <meta> tag (svelte.config.js kit.csp) so the inline hydration script can be
# hashed at build time. frame-ancestors is invalid in a meta CSP, so it is
# delivered here; it supersedes X-Frame-Options (kept above for old browsers).
add_header Content-Security-Policy "frame-ancestors 'none'" always;

# TLS terminates at the platform gateway; the browser associates the header
# with the https origin it fetched from, so setting it here is correct.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
