<!doctype html>
<html lang="da">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="/logo.png" />
		<link rel="apple-touch-icon" href="/logo.png" />
		<title>AS - Coaching, vaner og ro — Energi, nærvær og indre styrke</title>
		<meta
			name="description"
			content="Personlig coaching i stress, angst, vaner og overspisning. Få overskud i hverdagen og skab rum for personlig udvikling. Book en gratis startsamtale."
		/>
		<!-- Canonical URL + social-sharing metadata. The site is a single static
		     page, so these are hardcoded to the production host (the same trusted
		     host the Umami data-domains pins to) rather than computed at runtime. -->
		<link rel="canonical" href="https://ascoachingogvaner.dk/" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="AS - Coaching, vaner og ro" />
		<meta property="og:locale" content="da_DK" />
		<meta property="og:url" content="https://ascoachingogvaner.dk/" />
		<meta property="og:title" content="AS - Coaching, vaner og ro — Energi, nærvær og indre styrke" />
		<meta
			property="og:description"
			content="Personlig coaching i stress, angst, vaner og overspisning. Få overskud i hverdagen og skab rum for personlig udvikling. Book en gratis startsamtale."
		/>
		<meta property="og:image" content="https://ascoachingogvaner.dk/og-image.jpg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="AS - Coaching, vaner og ro" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="AS - Coaching, vaner og ro — Energi, nærvær og indre styrke" />
		<meta
			name="twitter:description"
			content="Personlig coaching i stress, angst, vaner og overspisning. Få overskud i hverdagen og skab rum for personlig udvikling. Book en gratis startsamtale."
		/>
		<meta name="twitter:image" content="https://ascoachingogvaner.dk/og-image.jpg" />
		<!-- Fonts are self-hosted build assets (see src/app.css, #98) — no
		     third-party font origins, no preconnects. -->
		<!-- Umami privacy-first web analytics (self-hosted on the platform).
		     data-domains restricts the tracker to the trusted host so the public
		     website-id can't be used to send events from a spoofed site. -->
		<script defer src="https://analytics.platform.devantler.tech/script.js" data-website-id="5e76b00b-67e5-4aef-b4df-17fca43e9a33" data-domains="ascoachingogvaner.dk"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- Tailwind's `contents` utility replaces the inline style attribute so
		     style-src in the CSP (svelte.config.js) needs no 'unsafe-inline'. -->
		<div class="contents">%sveltekit.body%</div>
	</body>
</html>
